<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Robinhood Board</title>
<style>
:root{--bg:#f7f7f5;--ink:#111;--muted:#737373;--line:#ddd;--green:#00c805}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.brand{font-weight:800;letter-spacing:-.04em}.nav{color:#666;font-size:14px}button{cursor:pointer}.wallet,.buy{border:0;background:var(--green);font-weight:800;border-radius:999px;padding:11px 16px}
main{max-width:1200px;margin:auto;padding:48px 20px}.hero{text-align:center}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(44px,7vw,76px);letter-spacing:-.07em;line-height:.95;margin:12px 0}.sub{color:var(--muted);max-width:600px;margin:16px auto 28px;line-height:1.5}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.stat{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px}
.wrap{margin-top:34px;background:#fff;border:1px solid #ccc;padding:10px;border-radius:16px}.board{width:min(900px,92vw);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(100,1fr);gap:1px;background:#ddd}
.block{background:#fafafa;border:0;padding:0;min-width:0}.block:hover{background:#dff8e0}.block.selected{outline:2px solid var(--green);z-index:2}.block.owned{background:#111}.block.owned:hover{background:var(--green)}
.modal-bg{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-bg.open{display:flex}.modal{background:#fff;border-radius:18px;padding:24px;width:min(440px,100%)}.close{float:right;border:0;border-radius:50%;width:32px;height:32px}.price{font-size:28px;font-weight:800;margin:15px 0}.muted{color:var(--muted);font-size:13px}.buy{width:100%;border-radius:12px;margin-top:20px}.buy:disabled{opacity:.5}.tx{margin-top:12px;word-break:break-all;font-size:12px}
</style></head>
<body>
<header><div class="brand">ROBINHOOD BOARD</div><div class="nav">10,000 fixed blocks</div><button class="wallet" id="wallet">Connect Wallet</button></header>
<main><section class="hero"><div class="eyebrow">Robinhood Chain Testnet</div><h1>Own a piece.</h1><p class="sub">10,000 permanent blocks. Connect a wallet, select blocks, and buy them on-chain.</p><div class="stats"><div class="stat"><b id="available">10,000</b> available</div><div class="stat"><b>0.01 ETH</b> / block</div><div class="stat"><b id="selected">0</b> selected</div></div></section>
<div class="wrap"><div class="board" id="board"></div></div></main>
<div class="modal-bg" id="bg"><div class="modal"><button class="close" id="close">×</button><div class="muted">Selection</div><h2 id="title">0 blocks</h2><div class="price" id="price">0 ETH</div><div class="muted">Testnet ETH only.</div><button class="buy" id="buy">SELECT BLOCKS</button><div class="tx" id="tx"></div></div></div>
<script type="module">
import{ethers}from"https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm";
const RPC="https://rpc.testnet.chain.robinhood.com",EXPLORER="https://explorer.testnet.chain.robinhood.com",CHAIN="0xB6E6",PRICE=ethers.parseEther("0.01");
const CONTRACT_ADDRESS="PASTE_CONTRACT_ADDRESS_HERE";
const ABI=["function buyBlocks(uint256[] blockIds) payable"];
let provider,signer,contract;const selected=new Set(),board=document.querySelector("#board");
for(let i=1;i<=10000;i++){const b=document.createElement("button");b.className="block";b.dataset.id=i;b.title="#"+i;b.onclick=()=>toggle(i);board.appendChild(b)}
function render(){document.querySelector("#selected").textContent=selected.size;document.querySelector("#title").textContent=selected.size+" block"+(selected.size===1?"":"s");document.querySelector("#price").textContent=ethers.formatEther(PRICE*BigInt(selected.size))+" ETH";document.querySelector("#buy").textContent=selected.size?"BUY "+selected.size+" BLOCK"+(selected.size===1?"":"S"):"SELECT BLOCKS"}
function toggle(id){selected.has(id)?selected.delete(id):selected.add(id);document.querySelector('[data-id="'+id+'"]').classList.toggle("selected",selected.has(id));render();document.querySelector("#bg").classList.add("open")}
async function connect(){if(!window.ethereum)return alert("Install an EVM wallet first.");await window.ethereum.request({method:"eth_requestAccounts"});let c=await window.ethereum.request({method:"eth_chainId"});if(c.toLowerCase()!==CHAIN.toLowerCase()){try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:CHAIN}]})}catch(e){if(e.code===4902)await window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:CHAIN,chainName:"Robinhood Chain Testnet",nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},rpcUrls:[RPC],blockExplorerUrls:[EXPLORER]}]});else throw e}}provider=new ethers.BrowserProvider(window.ethereum);signer=await provider.getSigner();contract=CONTRACT_ADDRESS.startsWith("0x")?new ethers.Contract(CONTRACT_ADDRESS,ABI,signer):null;const a=await signer.getAddress();document.querySelector("#wallet").textContent=a.slice(0,6)+"…"+a.slice(-4)}
async function buy(){if(!selected.size)return;if(!signer)await connect();if(!contract)return alert("Deploy the contract and paste its address into CONTRACT_ADDRESS first.");const ids=[...selected].sort((a,b)=>a-b),total=PRICE*BigInt(ids.length),btn=document.querySelector("#buy");try{btn.disabled=true;btn.textContent="CONFIRM IN WALLET…";const tx=await contract.buyBlocks(ids,{value:total});document.querySelector("#tx").innerHTML='Sent: <a target="_blank" href="'+EXPLORER+'/tx/'+tx.hash+'">'+tx.hash+"</a>";await tx.wait();ids.forEach(id=>document.querySelector('[data-id="'+id+'"]').classList.add("owned"));selected.clear();render();btn.textContent="CONFIRMED"}catch(e){alert(e.shortMessage||e.reason||e.message)}finally{btn.disabled=false;render()}}
document.querySelector("#wallet").onclick=connect;document.querySelector("#buy").onclick=buy;document.querySelector("#close").onclick=()=>document.querySelector("#bg").classList.remove("open");render();
</script></body></html>
